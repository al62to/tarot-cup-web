# Baut die Website mit Astro, prüft sie und veröffentlicht sie auf GitHub Pages. Veröffentlicht wird nur vom Zweig
# main; andere Zweige und Pull Requests werden nur gebaut und geprüft. Die Prüfungen (tools/pruefe_bau.mjs) laufen
# schon im Bau mit; ein Fund bricht ihn ab.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      # Die ganze Geschichte: sitemap.xml und die strukturierten Daten lesen den Tag der letzten Änderung aus Git
      # (src/daten/stand.mjs).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run pruefen
      # IndexNow (AP-T2): Adressen, deren lastmod am Tag des vorigen Stands von main oder später liegt (beim ersten
      # Lauf oder von Hand gestartet: alle). Gemeldet wird erst nach dem Veröffentlichen (Aufgabe indexnow).
      - if: github.ref == 'refs/heads/main'
        env:
          VORHER: ${{ github.event.before }}
        run: |
          if [ -n "$VORHER" ] && [ "$VORHER" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$VORHER^{commit}" 2>/dev/null; then
            SEIT=$(git log -1 --format=%cs "$VORHER")
          else
            SEIT=alle
          fi
          node tools/indexnow.mjs liste dist "$SEIT" indexnow_adressen.txt
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow_adressen.txt
          retention-days: 3
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    if: github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - id: seite
        uses: actions/deploy-pages@v4

  # Meldet die geänderten Adressen an IndexNow, erst wenn die Seite veröffentlicht ist. Ein Fehler hier lässt die
  # veröffentlichte Seite unberührt.
  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: veroeffentlichen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
      - run: node tools/indexnow.mjs senden indexnow_adressen.txt
